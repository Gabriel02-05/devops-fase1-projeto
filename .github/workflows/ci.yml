name: Pipeline CI - DevOps Fase 1

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Testes Automatizados da Aplicação
  test-application:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Executar Suíte de Testes (PyTest)
        run: |
          pytest tests/

  # JOB 2: Validação da Infraestrutura como Código (IaC)
  lint-and-validate-terraform:
    name: Validar Scripts Terraform
    runs-on: ubuntu-latest
    needs: test-application

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar o Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Checar Formatação do Terraform
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Inicializar o Terraform
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Validar Sintaxe do Terraform
        run: terraform validate
        working-directory: ./terraform
